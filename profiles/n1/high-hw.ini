# High-HW profile is intended for multi-disk / high-parallelism deployments.
# On a single raw NVMe blob device, this profile can oversubscribe the device.
# Prefer `profiles/n1/single-raw-nvme.ini` for one raw Linux-owned NVMe.
[upload_config]
max_concurrent_io=512
adaptive_concurrency_enabled=true
adaptive_concurrency_interval_ms=500
writer_buffer_size=524288
upload_memory_budget_bytes=536870912
upload_part_strict_durability_default=false
upload_io_gate_enabled=true
stream_max_concurrency=1024
stream_chunk_size=1048576
stream_readahead_bytes=2097152
stream_locality_bias_enabled=true
prefix_max_delta_segments=4096
monitor_interval_seconds=1
monitor_deep_scan_interval_seconds=30
max_part_size=134217728
data_shards=1
parity_shards=0
stripe_block_size=262144
