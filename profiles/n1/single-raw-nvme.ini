# Single raw NVMe blob profile.
# Tuned for one Linux-owned raw blob device using O_DIRECT.
# Favors larger IOs and lower scheduler pressure over massive fan-out.

[upload_config]
max_concurrent_io=12
adaptive_concurrency_enabled=false
adaptive_concurrency_interval_ms=1000
writer_buffer_size=1048576
upload_memory_budget_bytes=268435456
upload_part_strict_durability_default=false
upload_io_gate_enabled=true
stream_max_concurrency=48
stream_chunk_size=1048576
stream_readahead_bytes=4194304
stream_locality_bias_enabled=true
prefix_max_delta_segments=1024
prefix_compact_trigger_segments=256
prefix_compact_min_interval_seconds=30
monitor_interval_seconds=2
monitor_deep_scan_interval_seconds=60
max_part_size=268435456
data_shards=1
parity_shards=0
stripe_block_size=1048576
