[package]
name = "n1"
version.workspace = true
edition = "2024"
description = "Litiaina N1 standalone object store built on the LINK architecture"

[[bin]]
name = "litiaina-n1"
path = "src/main.rs"

[[bin]]
name = "litiaina-n1-backup"
path = "src/bin/backup.rs"

[dependencies]
n1_link = { path = "../link" }
cli_core = { path = "../cli_core" }
n1_native_client = { path = "../native_client" }
clap.workspace = true
ring = "0.17"
axum.workspace = true
chrono.workspace = true
once_cell.workspace = true
core_affinity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
hostname.workspace = true
walkdir.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
axum-server.workspace = true
jsonwebtoken.workspace = true
rustls.workspace = true
bytes.workspace = true
ulid.workspace = true
libc.workspace = true
ecs-core = { git = "https://github.com/Litiaina/ecs-core.git", rev = "c77c638bfb709368f49517f2828fa977738e8467" }
tokio-stream.workspace = true
rmp-serde.workspace = true
argon2.workspace = true
base64.workspace = true
uuid.workspace = true
governor.workspace = true
tower_governor.workspace = true
tower.workspace = true
rand.workspace = true
reqwest.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = "3.20.0"
rust-ini.workspace = true
