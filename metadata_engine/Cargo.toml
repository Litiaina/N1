[package]
name = "n1_metadata_engine"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "N1 metadata transactions backed by the ProcyonDB storage engine"

[[bin]]
name = "litiaina-n1-metadata"
path = "src/main.rs"

[dependencies]
procyon-engine = { path = "storage" }
n1_link = { path = "../link" }
n1_native_client = { path = "../native_client" }
rustls.workspace = true
ulid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
cli_core = { path = "../cli_core" }
axum.workspace = true
axum-server.workspace = true
tower-http.workspace = true
tokio-util = { workspace = true, features = ["io", "compat"] }
tracing.workspace = true
tokio-stream.workspace = true
tower = { workspace = true, features = ["util"] }
serde_bytes.workspace = true
tokio-rustls = "0.26.4"
chrono.workspace = true
libc.workspace = true
futures-util.workspace = true
bytes.workspace = true
sha2.workspace = true
argon2.workspace = true
rand.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
hmac.workspace = true
percent-encoding.workspace = true
rust-ini.workspace = true
rmp-serde.workspace = true
tokio-tar.workspace = true
async_zip.workspace = true

[dev-dependencies]
tempfile = "3.20.0"
reqwest.workspace = true
