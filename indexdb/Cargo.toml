[package]
name = "indexdb"
description = "Internal embedded index database for Litiaina N2"
readme = "README.md"
version = "3.1.1"
autobenches = false
autoexamples = false
autotests = false
exclude = ["fuzz/"]
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
homepage = "https://litiaina.internal/n2/indexdb"
repository = "https://litiaina.internal/n2"
authors = ["Litiaina N2"]

[dependencies]
log = { version = "0.4.17", optional = true }
chrono_v0_4 = { package = "chrono", version= "0.4.41", optional = true }
uuid = { version= "1.17.0", optional = true }

[target.'cfg(target_os = "wasi")'.dependencies]
libc = "0.2.174"

# Common test/bench dependencies
[dev-dependencies]
rand = "0.10.0"
tempfile = "3.5.0"
bincode = "2.0.1"
uuid = { version= "1.17.0", features = ["v4"] }

[features]
# Enables log messages
logging = ["dep:log"]
# Enable cache hit metrics
cache_metrics = []

[lints.clippy]
big_endian_bytes = "deny"
dbg_macro = "deny"
host_endian_bytes = "deny"
