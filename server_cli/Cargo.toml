[package]
name = "server_cli"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
sha2 = "0.10.9"
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
rustls = { version = "0.23.31", features = ["ring"] }
rpassword = "7.4.0"
aes-gcm = { version = "0.10.3", features = ["aes"] }
rand = "0.9.2"
pbkdf2 = "0.12.2"
bson = { version = "3.0.0", features = ["serde"] }
chrono = "0.4.42"
