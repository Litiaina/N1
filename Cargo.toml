[workspace]
members = [
    "cli_core",
    "engine",
    "shell",
    "native_client",
    "tools/n1-release-proof",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-windows]
inherits = "release"
panic = "unwind"
strip = false

[workspace.dependencies]
argon2 = "0.5.3"
async_zip = { version = "0.0.18", features = ["tokio", "deflate"] }
axum = { version = "0.8.4", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
core_affinity = "0.8.3"
crc32fast = "1.5.0"
dashmap = "6.1.0"
dotenv = "0.15.0"
futures-util = "0.3.31"
governor = "0.10.2"
headers = "0.4.0"
hex = "0.4.3"
hmac = "0.12.1"
hostname = "0.4.1"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
libc = "0.2.178"
md4 = "0.10.2"
mime_guess = "2.0.5"
moka = { version = "0.12", features = ["future"] }
once_cell = "1.21.3"
percent-encoding = "2.3.1"
rand = "0.8.0"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
rmp-serde = "1.3.1"
rpassword = "7.4.0"
rust-ini = "0.21.3"
rustix = { version = "1.1.4", features = ["fs"] }
rustls = { version = "0.23.31", features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tar = "0.3.1"
tokio-util = "0.7.15"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors", "fs", "trace"] }
tower_governor = "0.8.0"
tracing = "0.1.41"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ulid = "1.2.1"
uuid = { version = "1.18.0", features = ["v4"] }
walkdir = "2.5.0"
