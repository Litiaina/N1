[package]
name = "litiaina-fs-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["ws", "multipart"] }
bytes = "1.10.1"
chrono = "0.4.41"
futures = "0.3.31"
mime_guess = "2.0.5"
once_cell = "1.21.3"
percent-encoding = "2.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7.15"
tower-http = { version = "0.6.2", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = "1.16.0"
walkdir = "2.5.0"
futures-util = "0.3.31"
async-stream = "0.3.6"
