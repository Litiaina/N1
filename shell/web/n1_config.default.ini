[server]
host=127.0.0.1
https_port=50001
native_port=50002
cert_path=
key_path=

[disk_config]
fs_storage_path=

[storage_pool.A]
generation=1
roots=
data_shards=3
parity_shards=1
sealed=false

[index_config]
partition_count=64

[garbage_collector]
cleanup_interval_seconds=3600
file_ttl_seconds=3600
trash_retention_seconds=2592000

[auto_healing]
; Optional online checksum maintenance: e.g. Sun 02:00 (UTC), or daily 02:00.
; Empty disables scheduled scans. Existing enabled=true alone does not opt in.
scrub_schedule_utc=
scheduled_scrub_pause_millis=25
# Full repair/checksum walks are explicit. Read-triggered repair stays enabled.
# Legacy scan settings remain accepted but do not schedule object scans.
enabled=false
topology_check_interval_seconds=30
topology_recovery_stability_seconds=10
initial_scan_delay_seconds=60
availability_scan_interval_seconds=3600
checksum_scrub_interval_seconds=604800
object_scan_concurrency=1
shard_repair_concurrency=1
metadata_batch_size=128

[set_limits]
max_file_size=5368709120

[jwt_token_config]
login_token_expiration=900

[rate_limiter_config]
enable_rate_limiting=true
auth_limit_per_second=2
auth_limit_burst_size=5
view_limit_per_second=30
view_limit_burst_size=100
upload_limit_per_second=300
upload_limit_burst_size=3000
global_limit_per_second=200
global_limit_burst_size=300

[upload_config]
max_concurrent_io=auto
adaptive_concurrency_enabled=true
adaptive_concurrency_interval_ms=auto
writer_buffer_size=auto
upload_memory_budget_bytes=auto
upload_part_strict_durability_default=false
upload_io_gate_enabled=true
stream_max_concurrency=auto
stream_chunk_size=auto
stream_readahead_bytes=auto
stream_locality_bias_enabled=true
monitor_interval_seconds=auto
monitor_deep_scan_interval_seconds=auto
max_part_size=52428800
stripe_block_size=262144

[io_control]
foreground_wait_timeout_ms=30000
stall_threshold_ms=20000
slow_io_threshold_ms=1000
latency_samples_per_class=1024
