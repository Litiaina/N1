[package]
name = "n1_shell"
version = "1.0.0-RC.2"
edition = "2024"
description = "Litiaina N1 native CLI and object-backup operator host"

[[bin]]
name = "litiaina-n1-shell"
path = "src/main.rs"

[dependencies]
cli_core = { path = "../cli_core" }
clap.workspace = true
n1_link = { path = "../link" }
n1_native_client = { path = "../native_client" }
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
axum-server.workspace = true
tower-http.workspace = true
serde.workspace = true
rustls.workspace = true
sha2.workspace = true
rand.workspace = true
hex.workspace = true
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
n1 = { path = "../object_engine" }

[dev-dependencies]
rmp-serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tempfile = "3.20.0"
rust-ini.workspace = true
